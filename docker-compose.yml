version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: cookiemisu_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cookiemisu_net

  backend:
    build: ./backend
    container_name: cookiemisu_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
    networks:
      - cookiemisu_net

  frontend:
    build: ./frontend
    container_name: cookiemisu_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cookiemisu_net

volumes:
  mongo_data:

networks:
  cookiemisu_net:
    driver: bridge